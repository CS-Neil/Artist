name: Deploy site to GitHub Pages

# 每个分支的推送都会构建一遍，用来检查网站能否正常生成；
# 只有推送到默认分支（或手动运行）时才会发布到 GitHub Pages。
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
    steps:
      - name: Install Hugo Extended
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Pages
        id: pages
        if: env.IS_DEFAULT_BRANCH == 'true'
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: hugo --gc --minify ${BASE_URL:+--baseURL "$BASE_URL/"}

      - name: Upload artifact
        if: env.IS_DEFAULT_BRANCH == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
